[project]
name = "pal-mjlab"
version = "0.1.0"
description = "PAL Robotics' robots in mjlab "
readme = "README.md"
authors = [
    { name = "Louis Le Lay", email = "louislelay@pal-robotics.com" }
]
requires-python = ">=3.10,<3.14"
dependencies = [
    "mjlab",
    "moviepy>=2.0"
]

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.14.14",
    "pytest>=v9.0.3",
]
docs = [
    "sphinx>=8.1.3",
    "sphinx-book-theme>=1.1.4",
]

[project.optional-dependencies]
cu126 = ["torch>=2.11.0", "warp-lang"]
cpu = ["torch>=2.11.0"]

[tool.uv]
conflicts = [
  [{extra = "cu126"}, {extra = "cpu"}],
]
# moviepy 2.x caps pillow at <12 while mjviser (via mjlab) needs >=12.2.
# The cap is precautionary; moviepy works with pillow 12, so lift it.
override-dependencies = ["pillow>=12.2.0"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
mjlab = { git = "https://github.com/mujocolab/mjlab", rev = "23bf081018aa689af9b0394ea717b47ff0aaf416" }
torch = [
  { index = "pytorch-cu126", extra = "cu126", marker = "sys_platform != 'darwin'" },
  { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
]
# Default warp wheels are built against CUDA 13 and need driver >= 580; use the
# CUDA 12 build so cu126 runs on older drivers (e.g. 12.2 on HPC clusters).
warp-lang = [
  { url = "https://github.com/NVIDIA/warp/releases/download/v1.18.0/warp_lang-1.18.0+cu12-py3-none-manylinux_2_28_x86_64.whl", extra = "cu126", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[tool.ruff]
indent-width = 2
src = ["pal_mjlab"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[project.entry-points."mjlab.tasks"]
pal_mjlab = "pal_mjlab.tasks"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:torch.jit._script",
]
