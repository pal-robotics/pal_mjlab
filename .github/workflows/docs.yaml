name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'src/pal_mjlab/docs/**'
      - '.github/workflows/docs.yaml'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    branches: [main]
    paths:
      - 'src/pal_mjlab/docs/**'
      - '.github/workflows/docs.yaml'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:

env:
  UV_FROZEN: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "0.9.27"
      # Only the docs group is installed: the docs are plain RST, so torch/mjlab are not needed.
      - name: Build documentation
        run: uv run --only-group docs sphinx-build -W --keep-going -b html src/pal_mjlab/docs _build/html
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _build/html

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
